# MP044 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G137"          # your group id, e.g. "G042"
problem_id: "MP044"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "litres_paid_in_passbook"           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of village_cluster whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "fodder_price_rs"
    value: -999            # the special number typed instead of a blank
    count: 35           # how many rows have it
  duplicate_rows:
    present: true
    count: 32          # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "cows"
    start_date: "2026-02-23"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-03-18"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    cows: null
    buffaloes: null
    fodder_price_rs: null
    temp_c: null
    vet_visits: null
    feed_kg: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of village_cluster
    'Cluster A': null
    'Cluster B': null
    'Cluster C': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
